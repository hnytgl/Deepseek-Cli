name: Build SproutSpeak APK

on:
  push:
    branches: [sproutspeak-apk-build]
    paths:
      - 'sproutspeak-android/**'
      - '.github/workflows/sproutspeak-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: sproutspeak-android
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp sproutspeak-android/app/build/outputs/apk/debug/app-debug.apk SproutSpeak-Tablet-v1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SproutSpeak-Android-APK
          path: SproutSpeak-Tablet-v1.0.0.apk
          if-no-files-found: error
