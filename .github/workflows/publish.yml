name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: deepseek-windows-x64
            binary: deepseek.exe
          - os: macos-latest
            artifact: deepseek-macos-x64
            binary: deepseek
          - os: ubuntu-latest
            artifact: deepseek-linux-x64
            binary: deepseek
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pyinstaller
      - run: pyinstaller --onefile --name deepseek src/deepseek_cli/__main__.py
      - if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/${{ matrix.binary }} -DestinationPath ${{ matrix.artifact }}.zip
      - if: runner.os != 'Windows'
        run: zip -j ${{ matrix.artifact }}.zip dist/${{ matrix.binary }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
  release-assets:
    runs-on: ubuntu-latest
    needs: [binaries]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format tar.gz --prefix deepseek-cli-${{ github.ref_name }}/ -o deepseek-cli-${{ github.ref_name }}.tar.gz HEAD
      - uses: softprops/action-gh-release@v2
        with:
          files: deepseek-cli-${{ github.ref_name }}.tar.gz
