name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
  release-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format tar.gz --prefix deepseek-cli-${{ github.ref_name }}/ -o deepseek-cli-${{ github.ref_name }}.tar.gz HEAD
      - uses: softprops/action-gh-release@v2
        with:
          files: deepseek-cli-${{ github.ref_name }}.tar.gz
