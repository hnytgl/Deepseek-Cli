[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "deepseek-codex-cli"
version = "0.8.1"
description = "A Codex-style command line coding agent powered by DeepSeek."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "DeepSeek CLI Maintainers" }
]
keywords = ["deepseek", "cli", "coding-agent", "tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]
dependencies = [
  "prompt-toolkit>=3.0.43",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/hnytgl/deepseek-cli"
Repository = "https://github.com/hnytgl/deepseek-cli"
Issues = "https://github.com/hnytgl/deepseek-cli/issues"

[project.scripts]
deepseek = "deepseek_cli.cli:main"
deepseek-cli = "deepseek_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deepseek_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
