plugins { id 'com.android.application' }

android {
    namespace 'com.sproutspeak.kids'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sproutspeak.kids'
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName '1.5.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.75'
}
